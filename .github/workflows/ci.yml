# =============================================================================
# Gooey CI Pipeline
# =============================================================================
# Runs on push to main, pull requests, and manual triggers.
#
# Jobs:
#   - test-linux: Run unit tests on Linux
#   - test-macos: Run unit tests on macOS
#   - test-windows: Run Windows tests and build the examples, per renderer
#   - build-linux: Build all optimization levels on Linux
#   - build-macos: Build all optimization levels on macOS
#   - build-wasm: Build WebAssembly targets
#   - valgrind: Memory leak detection (Linux only)
#   - bench-macos: Run every benchmark on macOS as a smoke test (no gate)
#   - bench-ir: Instruction-count benchmark gate on PRs (Linux, not required)
#   - zig-fmt: Code formatting check
# =============================================================================

name: CI

on:
  push:
    # Run on main and on the long-lived integration branches.
    branches: [main, "integration/**"]
  pull_request:
    # Run the full pipeline for PRs targeting main or an integration branch.
    # Without the integration entry, PRs onto
    # integration/* would not trigger CI at all.
    branches: [main, "integration/**"]
  workflow_dispatch: {}

# Cancel in-progress runs for the same branch (except main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name != 'main' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Must be >= 0.17.0: build.zig.zon sets minimum_zig_version to 0.17.0.
  ZIG_VERSION: "0.17.0"

jobs:
  # ==========================================================================
  # Required Checks Summary
  # ==========================================================================
  required:
    name: "Required Checks"
    runs-on: ubuntu-latest
    needs:
      - test-linux
      - test-macos
      - test-windows
      - build-linux
      - build-macos
      - build-wasm
      - valgrind
      - zig-fmt
      - bench-macos
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          results='${{ toJSON(needs.*.result) }}'
          if echo "$results" | grep -qE '"(failure|cancelled)"'; then
            echo "result=failed" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi
          {
            echo 'results<<EOF'
            echo "$results"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Check for failed status
        if: steps.status.outputs.result != 'success'
        run: |
          echo "One or more required jobs failed: ${{ steps.status.outputs.results }}"
          exit 1

      - name: All checks passed
        run: echo "All required checks passed!"

  # ==========================================================================
  # Linux Tests
  # ==========================================================================
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libwayland-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libfontconfig-dev \
            libpng-dev \
            libdbus-1-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: zig-cache-linux-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-linux-

      - name: Run tests
        run: zig build test -Dskip-shader-compile=true

      # The fbdev build links no Wayland or Vulkan library, so only a linked
      # test binary shows that its tests reach neither.
      - name: Run tests (fbdev backend)
        run: zig build test -Dlinux-backend=fbdev

      # Likewise for the EVE build, whose host also links neither.
      - name: Run tests (eve backend)
        run: zig build test -Dlinux-backend=eve

  # ==========================================================================
  # macOS Tests
  # ==========================================================================
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/zig
            zig-cache
          key: zig-cache-macos-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-macos-

      - name: Run tests
        run: zig build test

      # The Linux bindings are plain externs, so the Linux backend can be
      # analyzed from macOS with no headers or system libraries.
      - name: Typecheck Linux backend
        run: zig build typecheck-linux

      # The Win32 and Vulkan bindings are plain externs too, so the Windows
      # backend can be analyzed from macOS with no SDK or import libraries.
      - name: Typecheck Windows backend
        run: zig build typecheck-windows

  # ==========================================================================
  # Windows Tests
  # ==========================================================================
  # GitHub's Windows runners have no GPU. The dx11 renderer's pixel tests run
  # on WARP, Direct3D's software rasterizer, so they need none either.
  test-windows:
    name: Test (Windows) (${{ matrix.renderer }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        renderer: [vulkan, dx11]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/zig
            .zig-cache
          key: zig-cache-windows-${{ matrix.renderer }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-windows-${{ matrix.renderer }}-
            zig-cache-windows-

      - name: Run tests
        run: zig build test-windows -Dwindows-renderer=${{ matrix.renderer }} --summary line

      - name: Build examples (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe -Dwindows-renderer=${{ matrix.renderer }}

  # ==========================================================================
  # Linux Build (Multiple Optimization Levels)
  # ==========================================================================
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            libwayland-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libfontconfig-dev \
            libpng-dev \
            libdbus-1-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: zig-cache-linux-${{ matrix.optimize }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-linux-${{ matrix.optimize }}-
            zig-cache-linux-

      - name: Build (${{ matrix.optimize }})
        run: zig build -Doptimize=${{ matrix.optimize }} -Dskip-shader-compile=true

  # ==========================================================================
  # macOS Build (Multiple Optimization Levels)
  # ==========================================================================
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: test-macos
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/zig
            zig-cache
          key: zig-cache-macos-${{ matrix.optimize }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-macos-${{ matrix.optimize }}-
            zig-cache-macos-

      - name: Build (${{ matrix.optimize }})
        run: zig build -Doptimize=${{ matrix.optimize }}

  # ==========================================================================
  # WebAssembly Build
  # ==========================================================================
  build-wasm:
    name: Build (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: zig-cache-wasm-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-wasm-

      - name: Build browser examples
        run: zig build wasm wasm-counter

      - name: Upload browser examples
        uses: actions/upload-artifact@v6
        with:
          name: gooey-wasm
          path: zig-out/web/
          retention-days: 14

  # ==========================================================================
  # Benchmarks (macOS)
  # ==========================================================================
  # A smoke test: every benchmark still builds and runs against the macOS
  # backends (CoreText, CoreGraphics). Nothing gates on its timings, which are
  # too noisy on shared VM runners; performance regressions are gated by
  # instruction counts in bench-ir. The uploaded results stay available for
  # manual comparison. The image is pinned so those results stay comparable.
  bench-macos:
    name: Benchmarks (macOS)
    runs-on: macos-26
    needs: test-macos
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/zig
            zig-cache
          key: zig-cache-bench-macos-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-bench-macos-
            zig-cache-macos-

      - name: Run all benchmarks
        run: zig build bench-all -Dbench-json-dir=bench-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-macos
          path: bench-results/
          retention-days: 90

  # ==========================================================================
  # Instruction-Count Benchmark Gate (Linux, PR only)
  # ==========================================================================
  # Builds the benchmarks of the PR's merge-base and of the PR (ReleaseFast,
  # baseline CPU), runs each benchmark of both under Cachegrind in this one job,
  # and fails when a benchmark's instruction count grows by more than 0.5%.
  # Instruction counts repeat to within ~0.1%, unlike wall time on shared
  # runners; see src/bench/cachegrind_gate.zig. Deliberately absent from
  # Required Checks until its signal has been reviewed on real PRs.
  bench-ir:
    name: Benchmark Ir Gate (Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The merge-base must be reachable to build the base side.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valgrind \
            libvulkan-dev \
            libwayland-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libfontconfig-dev \
            libpng-dev \
            libdbus-1-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: zig-cache-bench-ir-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-bench-ir-
            zig-cache-linux-

      # The checkout is the PR merged onto its base branch, so the merge-base
      # with the base branch is the base branch's tip: the comparison isolates
      # this PR's change. A base that predates the gate cannot build its
      # harnesses, so the gate reports that and passes.
      - name: Check out merge-base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eo pipefail
          base_sha=$(git merge-base HEAD "origin/${BASE_REF}")
          git worktree add --detach "${RUNNER_TEMP}/gooey-base" "${base_sha}"
          echo "Base: ${BASE_REF} at ${base_sha}"
          if grep -q '"bench-ir-build"' "${RUNNER_TEMP}/gooey-base/build.zig"; then
            echo "supported=true" >> "${GITHUB_OUTPUT}"
          else
            echo "supported=false" >> "${GITHUB_OUTPUT}"
            echo "Base ${base_sha} has no bench-ir-build step; nothing to compare." \
              | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Build benchmarks (base and head)
        if: steps.base.outputs.supported == 'true'
        run: |
          set -eo pipefail
          (cd "${RUNNER_TEMP}/gooey-base" && zig build bench-ir-build -Dskip-shader-compile=true)
          zig build bench-ir-build -Dskip-shader-compile=true

      - name: Compare instruction counts
        if: steps.base.outputs.supported == 'true'
        run: |
          set -eo pipefail
          zig build bench-ir-gate -Dskip-shader-compile=true -- \
            --base "${RUNNER_TEMP}/gooey-base/zig-out/bench-ir" \
            --head "${PWD}/zig-out/bench-ir" \
            --work "${RUNNER_TEMP}/bench-ir-work" \
            | tee bench-ir-report.md

      - name: Post instruction-count summary
        if: always() && steps.base.outputs.supported == 'true'
        run: |
          if [ -s bench-ir-report.md ]; then
            cat bench-ir-report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

  # ==========================================================================
  # Valgrind Memory Leak Detection
  # ==========================================================================
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    needs: test-linux
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            valgrind \
            libc6-dbg \
            libvulkan-dev \
            libwayland-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libfontconfig-dev \
            libpng-dev \
            libdbus-1-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            zig-cache
          key: zig-cache-valgrind-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-valgrind-
            zig-cache-linux-

      - name: Run tests under valgrind
        run: zig build test-valgrind -Dskip-shader-compile=true

  # ==========================================================================
  # Code Formatting
  # ==========================================================================
  zig-fmt:
    name: Zig Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check src/ charts/
