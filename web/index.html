<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gooey WebGPU</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
      }
      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        border-radius: 8px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }

      #status {
        color: #888;
        font-size: 14px;
      }
      .error {
        color: #e74c3c;
      }
      .success {
        color: #2ecc71;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas id="canvas" width="800" height="600"></canvas>
      <input
        id="hiddenInput"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        style="
          position: absolute;
          left: 0;
          top: 0;
          width: 1px;
          height: 1px;
          opacity: 0;
          pointer-events: none;
        "
      />
    </div>

    <script type="module">
      const canvas = document.getElementById("canvas");


      let device, queue, context, format;
      let wasmInstance;

      const handles = {
        shaderModules: new Map(),
        pipelines: new Map(),
        buffers: new Map(),
        bindGroups: new Map(),
        textures: new Map(),
        samplers: new Map(),
        layouts: new Map(),
        nextId: 1,
      };

      function allocHandle(map, obj) {
        const id = handles.nextId++;
        map.set(id, obj);
        return id;
      }

      const textDecoder = new TextDecoder();

      function getString(ptr, len) {
        const memory = wasmInstance.exports.memory;
        return textDecoder.decode(new Uint8Array(memory.buffer, ptr, len));
      }


      function ringSlot(ringPtr, eventBytes, name) {
        const header = new Uint32Array(wasmInstance.exports.memory.buffer, ringPtr, 4);
        const capacity = header[2];
        if (((header[0] - header[1]) >>> 0) >= capacity) {
          console.warn(
            `[Gooey] ${name} ring full (${capacity} events), event dropped. ` +
              "Raise ResourceLimits.events.queue_count_max.",
          );
          return -1;
        }
        return header[3] + (header[0] & (capacity - 1)) * eventBytes;
      }

      function ringCommit(ringPtr) {
        const header = new Uint32Array(wasmInstance.exports.memory.buffer, ringPtr, 4);
        header[0] = (header[0] + 1) >>> 0;
      }


      let mouseRingPtr = 0;

      let mouseButtons = 0;

      let lastClickTime = 0;
      let lastClickX = 0;
      let lastClickY = 0;
      let clickCount = 0;
      const DOUBLE_CLICK_TIME = 400;
      const DOUBLE_CLICK_RADIUS = 5;

      let currentModifiers = 0;

      let pointerButtons = 0;
      let lastPointerX = 0;
      let lastPointerY = 0;

      function cancelPointer() {
        if (mouseButtons === 0 && pointerButtons === 0) return;
        mouseButtons = 0;
        pointerButtons = 0;
        pushMouseEvent(6, 0, lastPointerX, lastPointerY, 0, currentModifiers);
      }

      function initMouse() {
        mouseRingPtr = wasmInstance.exports.getMouseRingPtr();
        console.log("[Gooey] Mouse initialized, mouseRingPtr:", mouseRingPtr);

        canvas.addEventListener("mousedown", handleMouseDown);
        canvas.addEventListener("mouseup", handleMouseUp);
        canvas.addEventListener("mousemove", handleMouseMove);
        canvas.addEventListener("mouseenter", handleMouseEnter);
        canvas.addEventListener("mouseleave", handleMouseLeave);

        canvas.addEventListener("pointerdown", (e) => {
          if (e.pointerType !== "mouse") return;
          canvas.setPointerCapture(e.pointerId);
          pointerButtons = e.buttons;
        });
        canvas.addEventListener("pointerup", (e) => {
          if (e.pointerType === "mouse") pointerButtons = e.buttons;
        });
        canvas.addEventListener("pointercancel", (e) => {
          if (e.pointerType === "mouse") cancelPointer();
        });
        canvas.addEventListener("lostpointercapture", (e) => {
          if (e.pointerType === "mouse" && pointerButtons !== 0) cancelPointer();
        });
        window.addEventListener("blur", () => {
          if (mouseButtons !== 0) cancelPointer();
        });

        canvas.addEventListener("contextmenu", (e) => e.preventDefault());

        window.addEventListener("keydown", updateModifiers);
        window.addEventListener("keyup", updateModifiers);
      }

      function updateModifiers(e) {
        currentModifiers =
          (e.shiftKey ? 1 : 0) |
          (e.ctrlKey ? 2 : 0) |
          (e.altKey ? 4 : 0) |
          (e.metaKey ? 8 : 0);
      }

      function getModifiersFromEvent(e) {
        return (
          (e.shiftKey ? 1 : 0) |
          (e.ctrlKey ? 2 : 0) |
          (e.altKey ? 4 : 0) |
          (e.metaKey ? 8 : 0)
        );
      }

      function getClickCount(x, y, now) {
        const timeDelta = now - lastClickTime;
        const distSq =
          (x - lastClickX) * (x - lastClickX) +
          (y - lastClickY) * (y - lastClickY);

        if (
          timeDelta < DOUBLE_CLICK_TIME &&
          distSq < DOUBLE_CLICK_RADIUS * DOUBLE_CLICK_RADIUS
        ) {
          clickCount = Math.min(clickCount + 1, 3);
        } else {
          clickCount = 1;
        }

        lastClickTime = now;
        lastClickX = x;
        lastClickY = y;

        return clickCount;
      }

      function handleMouseDown(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        mouseButtons |= 1 << e.button;

        const count = getClickCount(x, y, performance.now());
        const modifiers = getModifiersFromEvent(e);
        currentModifiers = modifiers;

        pushMouseEvent(0, e.button, x, y, count, modifiers);
      }

      function handleMouseUp(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        mouseButtons &= ~(1 << e.button);

        const modifiers = getModifiersFromEvent(e);
        currentModifiers = modifiers;

        pushMouseEvent(1, e.button, x, y, clickCount, modifiers);
      }

      function handleMouseMove(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const modifiers = getModifiersFromEvent(e);
        currentModifiers = modifiers;

        lastPointerX = x;
        lastPointerY = y;


        const eventType = mouseButtons !== 0 ? 3 : 2;
        const button =
          mouseButtons & 1
            ? 0
            : mouseButtons & 2
              ? 1
              : mouseButtons & 4
                ? 2
                : 0;

        pushMouseEvent(eventType, button, x, y, 0, modifiers);
      }

      function handleMouseEnter(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const modifiers = getModifiersFromEvent(e);

        pushMouseEvent(4, 0, x, y, 0, modifiers);
      }

      function handleMouseLeave(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        mouseButtons = 0;

        const modifiers = getModifiersFromEvent(e);

        pushMouseEvent(5, 0, x, y, 0, modifiers);
      }

      function pushMouseEvent(
        eventType,
        button,
        posX,
        posY,
        clickCount,
        modifiers,
      ) {
        if (!mouseRingPtr) return;

        const mem = wasmInstance.exports.memory.buffer;
        const eventOffset = ringSlot(mouseRingPtr, 24, "Mouse");
        if (eventOffset < 0) return;

        const view = new DataView(mem, eventOffset, 24);
        view.setFloat64(0, posX, true);
        view.setFloat64(8, posY, true);
        view.setUint8(16, eventType);
        view.setUint8(17, button);
        view.setUint8(18, clickCount);
        view.setUint8(19, modifiers);
        view.setUint32(20, 0, true);

        ringCommit(mouseRingPtr);
      }


      let scrollRingPtr = 0;

      function initScroll() {
        scrollRingPtr = wasmInstance.exports.getScrollRingPtr();
        console.log(
          "[Gooey] Scroll initialized, scrollRingPtr:",
          scrollRingPtr,
        );

        canvas.addEventListener("wheel", handleWheel, { passive: false });
      }

      function handleWheel(e) {
        e.preventDefault();

        if (!scrollRingPtr) return;

        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        let deltaX = e.deltaX;
        let deltaY = e.deltaY;

        if (e.deltaMode === 1) {
          deltaX *= 20;
          deltaY *= 20;
        } else if (e.deltaMode === 2) {
          deltaX *= canvas.clientHeight;
          deltaY *= canvas.clientHeight;
        }

        pushScrollEvent(x, y, deltaX, deltaY);
      }

      function pushScrollEvent(posX, posY, deltaX, deltaY) {
        const mem = wasmInstance.exports.memory.buffer;
        const eventOffset = ringSlot(scrollRingPtr, 24, "Scroll");
        if (eventOffset < 0) return;

        const view = new DataView(mem, eventOffset, 24);
        view.setFloat64(0, posX, true);
        view.setFloat64(8, posY, true);
        view.setFloat32(16, deltaX, true);
        view.setFloat32(20, deltaY, true);

        ringCommit(scrollRingPtr);
      }


      const KEY_CODE_MAP = {
        KeyA: 0x00,
        KeyS: 0x01,
        KeyD: 0x02,
        KeyF: 0x03,
        KeyH: 0x04,
        KeyG: 0x05,
        KeyZ: 0x06,
        KeyX: 0x07,
        KeyC: 0x08,
        KeyV: 0x09,
        KeyB: 0x0b,
        KeyQ: 0x0c,
        KeyW: 0x0d,
        KeyE: 0x0e,
        KeyR: 0x0f,
        KeyY: 0x10,
        KeyT: 0x11,
        KeyO: 0x1f,
        KeyU: 0x20,
        KeyI: 0x22,
        KeyP: 0x23,
        KeyL: 0x25,
        KeyJ: 0x26,
        KeyK: 0x28,
        KeyN: 0x2d,
        KeyM: 0x2e,

        Digit1: 0x12,
        Digit2: 0x13,
        Digit3: 0x14,
        Digit4: 0x15,
        Digit5: 0x17,
        Digit6: 0x16,
        Digit7: 0x1a,
        Digit8: 0x1c,
        Digit9: 0x19,
        Digit0: 0x1d,

        Enter: 0x24,
        Tab: 0x30,
        Space: 0x31,
        Backspace: 0x33,
        Escape: 0x35,
        Delete: 0x75,

        MetaLeft: 0x37,
        MetaRight: 0x36,
        ShiftLeft: 0x38,
        ShiftRight: 0x3c,
        CapsLock: 0x39,
        AltLeft: 0x3a,
        AltRight: 0x3d,
        ControlLeft: 0x3b,
        ControlRight: 0x3e,

        ArrowLeft: 0x7b,
        ArrowRight: 0x7c,
        ArrowDown: 0x7d,
        ArrowUp: 0x7e,

        Home: 0x73,
        End: 0x77,
        PageUp: 0x74,
        PageDown: 0x79,

        F1: 0x7a,
        F2: 0x78,
        F3: 0x63,
        F4: 0x76,
        F5: 0x60,
        F6: 0x61,
        F7: 0x62,
        F8: 0x64,
        F9: 0x65,
        F10: 0x6d,
        F11: 0x67,
        F12: 0x6f,
      };

      const UNKNOWN_KEY = 0xffff;

      let keyRingPtr = 0;
      let textBufferPtr = 0;

      function initKeyboard() {
        keyRingPtr = wasmInstance.exports.getKeyRingPtr();
        textBufferPtr = wasmInstance.exports.getTextBufferPtr();

        const hiddenInput = document.getElementById("hiddenInput");

        canvas.tabIndex = 0;
        canvas.style.outline = "none";

        canvas.addEventListener("keydown", (e) => {
          if (!e.metaKey && !e.ctrlKey && !e.altKey && e.key.length === 1) {
            hiddenInput.focus();
          }
          handleKeyDown(e);
        });
        canvas.addEventListener("keyup", handleKeyUp);

        hiddenInput.addEventListener("input", (e) => {
          if (e.isComposing) return;
          if (hiddenInput.value) {
            appendText(hiddenInput.value);
            hiddenInput.value = "";
          }
        });

        hiddenInput.addEventListener("compositionstart", (e) => {
          startComposition();
        });

        hiddenInput.addEventListener("compositionupdate", (e) => {
          updateCompositionText(e.data || "");
        });

        hiddenInput.addEventListener("compositionend", (e) => {
          finishComposition();
          if (e.data) {
            appendText(e.data);
            hiddenInput.value = "";
          }
        });

        hiddenInput.addEventListener("paste", (e) => {
          e.preventDefault();
          const text = e.clipboardData?.getData("text");
          if (text) {
            appendText(text);
          }
        });

        hiddenInput.addEventListener("keydown", (e) => {
          handleKeyDown(e);
          if (shouldPreventDefault(e)) {
            e.preventDefault();
            canvas.focus();
          }
        });
        hiddenInput.addEventListener("keyup", handleKeyUp);

        canvas.addEventListener("focus", () => {
          setTimeout(() => {
            if (document.activeElement === canvas) {
              hiddenInput.focus();
            }
          }, 10);
        });

        canvas.addEventListener("click", () => {
          hiddenInput.focus();
        });

        hiddenInput.focus();

        console.log(
          "[Gooey] Keyboard initialized, keyRingPtr:",
          keyRingPtr,
          "textBufferPtr:",
          textBufferPtr,
        );
      }

      function handleKeyDown(e) {
        if (isImeOwnedKey(e)) return;
        if (shouldPreventDefault(e)) {
          e.preventDefault();
        }
        pushKeyEvent(0, e);
        console.log("[Gooey] keydown:", e.code, e.key);
      }

      function handleKeyUp(e) {
        if (isImeOwnedKey(e)) return;
        pushKeyEvent(1, e);
      }

      function isImeOwnedKey(e) {
        return e.isComposing || e.keyCode === 229;
      }

      function handleBeforeInput(e) {
        if (e.data) {
          e.preventDefault();
          appendText(e.data);
        }
      }

      function handleCompositionEnd(e) {
        if (e.data) {
          appendText(e.data);
        }
      }

      function shouldPreventDefault(e) {
        if (isImeOwnedKey(e)) return false;
        const dominated = [
          "Tab",
          "Enter",
          "Backspace",
          "Delete",
          "Escape",
          "ArrowLeft",
          "ArrowRight",
          "ArrowUp",
          "ArrowDown",
          "Home",
          "End",
          "PageUp",
          "PageDown",
        ];

        if (dominated.includes(e.code)) return true;

        if ((e.metaKey || e.ctrlKey) && e.code === "KeyV") return false;

        if (e.metaKey || e.ctrlKey) return true;

        return false;
      }

      function pushKeyEvent(eventType, e) {
        if (!keyRingPtr) return;

        const mem = wasmInstance.exports.memory.buffer;
        const eventOffset = ringSlot(keyRingPtr, 8, "Key");
        if (eventOffset < 0) return;

        const bytes = new Uint8Array(mem, eventOffset, 8);
        const view = new DataView(mem, eventOffset, 8);

        bytes[0] = eventType;
        view.setUint16(1, KEY_CODE_MAP[e.code] ?? UNKNOWN_KEY, true);
        bytes[3] = packModifiers(e);
        bytes[4] = (e.repeat ? 1 : 0) | (e.isComposing ? 2 : 0);
        bytes[5] = 0;
        bytes[6] = 0;
        bytes[7] = 0;

        ringCommit(keyRingPtr);
      }

      function packModifiers(e) {
        return (
          (e.shiftKey ? 1 : 0) |
          (e.ctrlKey ? 2 : 0) |
          (e.altKey ? 4 : 0) |
          (e.metaKey ? 8 : 0)
        );
      }

      function utf8PrefixLength(bytes, limit) {
        if (bytes.length <= limit) return bytes.length;
        let n = limit;
        while (n > 0 && (bytes[n] & 0xc0) === 0x80) n--;
        return n;
      }

      function appendText(text) {
        if (!textBufferPtr) return;

        const mem = wasmInstance.exports.memory.buffer;
        const header = new Uint32Array(mem, textBufferPtr, 3);
        const capacity = header[1];
        const dataPtr = new Uint8Array(mem, header[2], capacity);

        const encoded = new TextEncoder().encode(text);
        const currentLen = header[0];
        const available = capacity - currentLen;

        const writeLen = utf8PrefixLength(encoded, available);
        if (writeLen < encoded.length) {
          console.warn(
            `[Gooey] Text buffer full, kept ${writeLen} of ${encoded.length} bytes. ` +
              "Raise ResourceLimits.events.text_bytes_max.",
          );
        }
        dataPtr.set(encoded.subarray(0, writeLen), currentLen);
        header[0] = currentLen + writeLen;
      }

      let compositionBufferPtr = null;

      function initComposition() {
        compositionBufferPtr = wasmInstance.exports.getCompositionBufferPtr();
      }

      function startComposition() {
        if (!compositionBufferPtr) return;
        const mem = new Uint8Array(wasmInstance.exports.memory.buffer);
        const view = new DataView(wasmInstance.exports.memory.buffer);
        view.setUint32(compositionBufferPtr, 0, true);
        mem[compositionBufferPtr + 4] = 1;
        mem[compositionBufferPtr + 5] = 0;
      }

      function finishComposition() {
        if (!compositionBufferPtr) return;
        const mem = new Uint8Array(wasmInstance.exports.memory.buffer);
        const view = new DataView(wasmInstance.exports.memory.buffer);
        view.setUint32(compositionBufferPtr, 0, true);
        mem[compositionBufferPtr + 4] = 0;
        mem[compositionBufferPtr + 5] = 1;
      }

      function updateCompositionText(text) {
        if (!compositionBufferPtr) return;
        const mem = new Uint8Array(wasmInstance.exports.memory.buffer);
        const view = new DataView(wasmInstance.exports.memory.buffer);
        const capacity = view.getUint32(compositionBufferPtr + 8, true);
        const dataPtr = view.getUint32(compositionBufferPtr + 12, true);

        const encoded = new TextEncoder().encode(text);
        const writeLen = utf8PrefixLength(encoded, capacity);
        if (writeLen < encoded.length) {
          console.warn(
            `[Gooey] Composition cut to ${writeLen} of ${encoded.length} bytes. ` +
              "Raise ResourceLimits.text.preedit_bytes_max.",
          );
        }

        for (let i = 0; i < writeLen; i++) {
          mem[dataPtr + i] = encoded[i];
        }

        view.setUint32(compositionBufferPtr, writeLen, true);
        mem[compositionBufferPtr + 4] = 1;
        mem[compositionBufferPtr + 5] = 1;
      }

      const textCanvas = new OffscreenCanvas(256, 256);
      const textCtx = textCanvas.getContext("2d", { willReadFrequently: true });

      const svgCanvas = new OffscreenCanvas(256, 256);
      const svgCtx = svgCanvas.getContext("2d", { willReadFrequently: true });

      function rasterizeSvgPathJS(
        pathData,
        deviceSize,
        viewbox,
        hasFill,
        strokeWidth,
        out,
      ) {
        if (out.length !== deviceSize * deviceSize * 4) {
          throw new Error(`SVG buffer of ${out.length} B for a ${deviceSize} px icon`);
        }
        const scale = deviceSize / viewbox;

        if (svgCanvas.width < deviceSize || svgCanvas.height < deviceSize) {
          svgCanvas.width = deviceSize;
          svgCanvas.height = deviceSize;
        }

        const path = new Path2D(pathData);

        let fillData = null;
        if (hasFill) {
          svgCtx.clearRect(0, 0, deviceSize, deviceSize);
          svgCtx.save();
          svgCtx.scale(scale, scale);
          svgCtx.fillStyle = "white";
          svgCtx.fill(path);
          svgCtx.restore();
          fillData = svgCtx.getImageData(0, 0, deviceSize, deviceSize).data;
        }

        let strokeData = null;
        if (strokeWidth > 0) {
          svgCtx.clearRect(0, 0, deviceSize, deviceSize);
          svgCtx.save();
          svgCtx.scale(scale, scale);
          svgCtx.strokeStyle = "white";
          svgCtx.lineWidth = strokeWidth / scale;
          svgCtx.lineCap = "round";
          svgCtx.lineJoin = "round";
          svgCtx.stroke(path);
          svgCtx.restore();
          strokeData = svgCtx.getImageData(0, 0, deviceSize, deviceSize).data;
        }

        for (let i = 0; i < deviceSize * deviceSize; i++) {
          const fillAlpha = fillData ? fillData[i * 4 + 3] : 0;
          const strokeAlpha = strokeData ? strokeData[i * 4 + 3] : 0;
          out[i * 4 + 0] = fillAlpha;
          out[i * 4 + 1] = strokeAlpha;
          out[i * 4 + 2] = 0;
          out[i * 4 + 3] = Math.max(fillAlpha, strokeAlpha);
        }
      }

      function getFont(fontPtr, fontLen, size) {
        const spec = getString(fontPtr, fontLen);
        const weightEnd = spec.indexOf(" ", spec.indexOf(" ") + 1);
        return `${spec.slice(0, weightEnd)} ${size}px ${spec.slice(weightEnd + 1)}`;
      }


      let a11yContainer = null;
      const a11yElementPool = new Map();
      let a11yNextId = 1;
      let a11yBatchDepth = 0;

      const a11y = {
        js_createContainer: () => {
          a11yContainer = document.createElement("div");
          a11yContainer.id = "gooey-a11y-root";
          a11yContainer.setAttribute("role", "application");
          a11yContainer.setAttribute("aria-label", "Gooey Application");

          Object.assign(a11yContainer.style, {
            position: "absolute",
            width: "1px",
            height: "1px",
            padding: "0",
            margin: "-1px",
            overflow: "hidden",
            clip: "rect(0, 0, 0, 0)",
            whiteSpace: "nowrap",
            border: "0",
          });

          document.body.appendChild(a11yContainer);
          return 0;
        },

        js_createElement: (rolePtr, roleLen) => {
          const role = getString(rolePtr, roleLen);
          const id = a11yNextId++;
          const el = document.createElement("div");
          el.setAttribute("role", role);
          el.setAttribute("tabindex", "-1");
          el.id = `gooey-a11y-${id}`;
          a11yElementPool.set(id, el);
          return id;
        },

        js_removeElement: (id) => {
          const el = a11yElementPool.get(id);
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
          a11yElementPool.delete(id);
        },

        js_setParent: (childId, parentId) => {
          const child = a11yElementPool.get(childId);
          const parent =
            parentId === 0 ? a11yContainer : a11yElementPool.get(parentId);
          if (child && parent && child.parentNode !== parent) {
            parent.appendChild(child);
          }
        },

        js_setAttribute: (id, attrPtr, attrLen, valPtr, valLen) => {
          const el = a11yElementPool.get(id);
          if (el) {
            const attr = getString(attrPtr, attrLen);
            const val = getString(valPtr, valLen);
            el.setAttribute(attr, val);
          }
        },

        js_removeAttribute: (id, attrPtr, attrLen) => {
          const el = a11yElementPool.get(id);
          if (el) {
            const attr = getString(attrPtr, attrLen);
            el.removeAttribute(attr);
          }
        },

        js_setBounds: (id, x, y, w, h) => {
          const el = a11yElementPool.get(id);
          if (el) {
            el.dataset.bounds = `${x},${y},${w},${h}`;
          }
        },

        js_focus: (id) => {
          void id;
        },

        js_announce: (msgPtr, msgLen, assertive) => {
          const message = getString(msgPtr, msgLen);

          const el = document.createElement("div");
          el.setAttribute("role", "status");
          el.setAttribute("aria-live", assertive ? "assertive" : "polite");
          el.setAttribute("aria-atomic", "true");

          Object.assign(el.style, {
            position: "absolute",
            width: "1px",
            height: "1px",
            overflow: "hidden",
            clip: "rect(0, 0, 0, 0)",
          });

          document.body.appendChild(el);

          requestAnimationFrame(() => {
            el.textContent = message;
            setTimeout(() => el.remove(), 1000);
          });
        },

        js_isScreenReaderHinted: () => {
          return (
            window.matchMedia("(prefers-reduced-motion: reduce)").matches ||
            document.body.classList.contains("sr-mode") ||
            true
          );
        },

        js_beginBatch: () => {
          a11yBatchDepth++;
        },

        js_endBatch: () => {
          a11yBatchDepth--;
        },
      };

      const env = {
        consoleLog: (ptr, len) => console.log("[WASM]", getString(ptr, len)),
        consoleError: (ptr, len) =>
          console.error("[WASM]", getString(ptr, len)),

        getTimestampMillis: () => Date.now(),

        getCanvasWidth: () => canvas.clientWidth,
        getCanvasHeight: () => canvas.clientHeight,
        getDevicePixelRatio: () => window.devicePixelRatio || 1,
        setCanvasSize: (w, h) => {
          canvas.width = w;
          canvas.height = h;
          context.configure({ device, format, alphaMode: "premultiplied" });
        },
        setDocumentTitle: (ptr, len) => {
          document.title = getString(ptr, len);
        },
        setCanvasCursor: (shape) => {
          canvas.style.cursor = ["default", "text", "pointer", "col-resize", "row-resize"][shape];
        },
        setImeCursorPosition(x, y, width, height) {
          const hiddenInput = document.getElementById("hiddenInput");
          const dpr = window.devicePixelRatio || 1;
          hiddenInput.style.left = `${x}px`;
          hiddenInput.style.top = `${y + height}px`;
          hiddenInput.style.width = `${Math.max(width, 1)}px`;
          hiddenInput.style.height = `${height}px`;
        },
        createShaderModule: (codePtr, codeLen) => {
          const code = getString(codePtr, codeLen);
          const module = device.createShaderModule({ code });
          module.getCompilationInfo().then((info) => {
            for (const message of info.messages) {
              if (message.type === "error") {
                console.error(
                  `[Gooey] WGSL ${message.lineNum}:${message.linePos}: ${message.message}`,
                );
              }
            }
          });
          return allocHandle(handles.shaderModules, module);
        },

        createBuffer: (size, usage) => {
          const buffer = device.createBuffer({ size, usage });
          return allocHandle(handles.buffers, buffer);
        },

        writeBuffer: (handle, offset, dataPtr, dataLen) => {
          const buffer = handles.buffers.get(handle);
          const memory = wasmInstance.exports.memory;
          const data = new Uint8Array(memory.buffer, dataPtr, dataLen);
          queue.writeBuffer(buffer, offset, data);
        },

        deviceMaxTextureDimension2D: () => device.limits.maxTextureDimension2D,
        deviceMaxStorageBufferBindingSize: () =>
          Math.min(device.limits.maxStorageBufferBindingSize, 0xffffffff),

        createPackedLayout: () => {
          const vertex = GPUShaderStage.VERTEX;
          const fragment = GPUShaderStage.FRAGMENT;
          const entries = [];
          for (let binding = 0; binding < 5; binding++) {
            entries.push({ binding, visibility: vertex, buffer: { type: "read-only-storage" } });
          }
          entries.push({ binding: 5, visibility: vertex, buffer: { type: "uniform" } });
          for (let binding = 6; binding < 9; binding++) {
            entries.push({ binding, visibility: fragment, texture: { sampleType: "float" } });
          }
          entries.push({ binding: 9, visibility: fragment, sampler: { type: "filtering" } });
          const bindGroupLayout = device.createBindGroupLayout({ entries });
          const pipelineLayout = device.createPipelineLayout({
            bindGroupLayouts: [bindGroupLayout],
          });
          return allocHandle(handles.layouts, { bindGroupLayout, pipelineLayout });
        },

        createPackedPipeline: (
          layoutHandle,
          shaderHandle,
          vsPtr,
          vsLen,
          fsPtr,
          fsLen,
          premultiplied,
        ) => {
          const layout = handles.layouts.get(layoutHandle);
          const module = handles.shaderModules.get(shaderHandle);
          const pipeline = device.createRenderPipeline({
            layout: layout.pipelineLayout,
            vertex: { module, entryPoint: getString(vsPtr, vsLen) },
            fragment: {
              module,
              entryPoint: getString(fsPtr, fsLen),
              targets: [
                {
                  format,
                  blend: {
                    color: {
                      srcFactor: premultiplied ? "one" : "src-alpha",
                      dstFactor: "one-minus-src-alpha",
                      operation: "add",
                    },
                    alpha: {
                      srcFactor: "one",
                      dstFactor: "one-minus-src-alpha",
                      operation: "add",
                    },
                  },
                },
              ],
            },
            primitive: { topology: "triangle-list" },
          });
          return allocHandle(handles.pipelines, pipeline);
        },

        createPackedBindGroup: (
          layoutHandle,
          buffersPtr,
          buffersLen,
          texturesPtr,
          texturesLen,
          samplerHandle,
        ) => {
          const layout = handles.layouts.get(layoutHandle);
          const memory = wasmInstance.exports.memory;
          const buffers = new Uint32Array(memory.buffer, buffersPtr, buffersLen);
          const textures = new Uint32Array(memory.buffer, texturesPtr, texturesLen);
          const entries = [];
          for (let i = 0; i < buffersLen; i++) {
            entries.push({ binding: i, resource: { buffer: handles.buffers.get(buffers[i]) } });
          }
          for (let i = 0; i < texturesLen; i++) {
            entries.push({
              binding: buffersLen + i,
              resource: handles.textures.get(textures[i]).createView(),
            });
          }
          entries.push({
            binding: buffersLen + texturesLen,
            resource: handles.samplers.get(samplerHandle),
          });
          const bindGroup = device.createBindGroup({
            layout: layout.bindGroupLayout,
            entries,
          });
          return allocHandle(handles.bindGroups, bindGroup);
        },

        currentEncoder: null,
        currentPass: null,

        beginFrame: (r, g, b, a) => {
          let view;
          try {
            view = context.getCurrentTexture().createView();
          } catch (e) {
            console.warn("[Gooey] no canvas texture:", e);
            return false;
          }
          env.currentEncoder = device.createCommandEncoder();
          env.currentPass = env.currentEncoder.beginRenderPass({
            colorAttachments: [
              {
                view,
                clearValue: { r, g, b, a },
                loadOp: "clear",
                storeOp: "store",
              },
            ],
          });
          return true;
        },

        setPipeline: (pipelineHandle) => {
          env.currentPass.setPipeline(handles.pipelines.get(pipelineHandle));
        },

        setBindGroup: (groupIndex, bindGroupHandle) => {
          env.currentPass.setBindGroup(groupIndex, handles.bindGroups.get(bindGroupHandle));
        },

        setScissorRect: (x, y, width, height) => {
          env.currentPass.setScissorRect(x, y, width, height);
        },

        draw: (vertexCount, instanceCount, firstVertex, firstInstance) => {
          env.currentPass.draw(vertexCount, instanceCount, firstVertex, firstInstance);
        },

        endFrame: () => {
          env.currentPass.end();
          queue.submit([env.currentEncoder.finish()]);
          env.currentPass = null;
          env.currentEncoder = null;
        },

        requestAnimationFrame: () => {
          requestAnimationFrame((timestamp) => {
            wasmInstance.exports.frame(timestamp);
          });
        },

        getFrameTime: () => performance.now(),

        getFontMetrics: (
          fontPtr,
          fontLen,
          size,
          outAscent,
          outDescent,
          outLineHeight,
        ) => {
          const font = getFont(fontPtr, fontLen, size);
          textCtx.font = font;
          const metrics = textCtx.measureText("bdfhklgyp");
          const ascent = metrics.actualBoundingBoxAscent;
          const descent = metrics.actualBoundingBoxDescent;
          const lineHeight = ascent + descent;

          const mem = new DataView(wasmInstance.exports.memory.buffer);
          mem.setFloat32(outAscent, ascent, true);
          mem.setFloat32(outDescent, descent, true);
          mem.setFloat32(outLineHeight, lineHeight, true);
        },

        measureText: (fontPtr, fontLen, size, textPtr, textLen) => {
          const font = getFont(fontPtr, fontLen, size);
          const text = getString(textPtr, textLen);
          textCtx.font = font;
          return textCtx.measureText(text).width;
        },

        rasterizeGlyph: (
          fontPtr,
          fontLen,
          size,
          codepoint,
          outBuffer,
          bufferSize,
          outWidth,
          outHeight,
          outBearingX,
          outBearingY,
          outAdvance,
        ) => {
          const font = getFont(fontPtr, fontLen, size);
          const char = String.fromCodePoint(codepoint);

          textCtx.font = font;
          textCtx.textBaseline = "alphabetic";
          const metrics = textCtx.measureText(char);

          const left = Math.ceil(metrics.actualBoundingBoxLeft);
          const right = Math.ceil(metrics.actualBoundingBoxRight);
          const ascent = Math.ceil(metrics.actualBoundingBoxAscent);
          const descent = Math.ceil(metrics.actualBoundingBoxDescent);

          const padding = 2;
          const width = left + right + padding;
          const height = ascent + descent + padding;
          const advance = metrics.width;

          if (textCanvas.width < width) textCanvas.width = Math.max(256, width);
          if (textCanvas.height < height)
            textCanvas.height = Math.max(256, height);

          textCtx.clearRect(0, 0, width, height);
          textCtx.font = font;
          textCtx.fillStyle = "white";
          textCtx.textBaseline = "alphabetic";
          textCtx.fillText(char, left + 1, ascent + 1);

          const imageData = textCtx.getImageData(0, 0, width, height);
          const mem = new Uint8Array(
            wasmInstance.exports.memory.buffer,
            outBuffer,
            bufferSize,
          );
          for (let i = 0; i < width * height && i < bufferSize; i++) {
            mem[i] = imageData.data[i * 4 + 3];
          }

          const view = new DataView(wasmInstance.exports.memory.buffer);
          view.setUint32(outWidth, width, true);
          view.setUint32(outHeight, height, true);
          view.setFloat32(outBearingX, -(left + 1), true);
          view.setFloat32(outBearingY, -(ascent - 1), true);
          view.setFloat32(outAdvance, advance, true);

        },
        rasterizeGlyphSubpixel: (
          fontPtr,
          fontLen,
          size,
          codepoint,
          subpixelX,
          subpixelY,
          outBuffer,
          bufferSize,
          outWidth,
          outHeight,
          outBearingX,
          outBearingY,
          outAdvance,
        ) => {
          const font = getFont(fontPtr, fontLen, size);
          const char = String.fromCodePoint(codepoint);

          textCtx.font = font;
          textCtx.textBaseline = "alphabetic";
          const metrics = textCtx.measureText(char);

          const left = Math.ceil(metrics.actualBoundingBoxLeft);
          const right = Math.ceil(metrics.actualBoundingBoxRight);
          const ascent = Math.ceil(metrics.actualBoundingBoxAscent);
          const descent = Math.ceil(metrics.actualBoundingBoxDescent);

          const padding = 2;
          let width = left + right + padding;
          let height = ascent + descent + padding;
          if (subpixelX > 0) width += 1;
          if (subpixelY > 0) height += 1;
          const advance = metrics.width;

          if (textCanvas.width < width) textCanvas.width = Math.max(256, width);
          if (textCanvas.height < height)
            textCanvas.height = Math.max(256, height);

          textCtx.clearRect(0, 0, width, height);
          textCtx.font = font;
          textCtx.fillStyle = "white";
          textCtx.textBaseline = "alphabetic";
          textCtx.fillText(char, left + 1 + subpixelX, ascent + 1 + subpixelY);

          const imageData = textCtx.getImageData(0, 0, width, height);
          const mem = new Uint8Array(
            wasmInstance.exports.memory.buffer,
            outBuffer,
            bufferSize,
          );
          for (let i = 0; i < width * height && i < bufferSize; i++) {
            mem[i] = imageData.data[i * 4 + 3];
          }

          const view = new DataView(wasmInstance.exports.memory.buffer);
          view.setUint32(outWidth, width, true);
          view.setUint32(outHeight, height, true);
          view.setFloat32(outBearingX, -(left + 1), true);
          view.setFloat32(outBearingY, -(ascent - 1), true);
          view.setFloat32(outAdvance, advance, true);
        },
        createAtlasTexture: (width, height, bytesPerPixel) => {
          const texture = device.createTexture({
            size: { width, height },
            format: bytesPerPixel === 1 ? "r8unorm" : "rgba8unorm",
            usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
          });
          return allocHandle(handles.textures, texture);
        },

        writeAtlasRegion: (
          textureHandle,
          x,
          y,
          width,
          height,
          bytesPerPixel,
          dataPtr,
          dataLen,
        ) => {
          const texture = handles.textures.get(textureHandle);
          if (!texture) {
            console.error(
              "writeAtlasRegion: invalid texture handle",
              textureHandle,
            );
            return;
          }
          const data = new Uint8Array(
            wasmInstance.exports.memory.buffer,
            dataPtr,
            dataLen,
          );
          queue.writeTexture(
            { texture, origin: { x, y } },
            data,
            { bytesPerRow: width * bytesPerPixel },
            { width, height },
          );
        },

        createSampler: () => {
          const sampler = device.createSampler({
            magFilter: "linear",
            minFilter: "linear",
            addressModeU: "clamp-to-edge",
            addressModeV: "clamp-to-edge",
          });
          return allocHandle(handles.samplers, sampler);
        },


        rasterizeSvgPath: (
          pathPtr,
          pathLen,
          deviceSize,
          viewbox,
          hasFill,
          strokeWidth,
          outBuffer,
          bufferSize,
        ) => {
          try {
            rasterizeSvgPathJS(
              getString(pathPtr, pathLen),
              deviceSize,
              viewbox,
              hasFill,
              strokeWidth,
              new Uint8Array(wasmInstance.exports.memory.buffer, outBuffer, bufferSize),
            );
            return true;
          } catch (e) {
            console.error("rasterizeSvgPath failed:", e);
            return false;
          }
        },

        isApplePlatform: () =>
          /Mac|iPhone|iPad|iPod/.test(
            navigator.userAgentData?.platform ?? navigator.platform,
          ),

        clipboardWriteText: (ptr, len) => {
          const text = getString(ptr, len);
          navigator.clipboard.writeText(text).catch((err) => {
            console.warn("[Gooey] Clipboard write failed:", err);
          });
        },
      };

      async function init() {
        if (!navigator.gpu) {
          console.error("WebGPU not supported in this browser");
          return;
        }

        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          console.error("Failed to get WebGPU adapter");
          return;
        }

        device = await adapter.requestDevice();
        queue = device.queue;
        device.addEventListener("uncapturederror", (event) => {
          console.error("[Gooey] WebGPU:", event.error.message);
        });

        context = canvas.getContext("webgpu");
        format = navigator.gpu.getPreferredCanvasFormat();
        context.configure({ device, format, alphaMode: "premultiplied" });

        const response = await fetch("app.wasm");
        if (!response.ok) {
          throw new Error(
            `Failed to load ${response.url}: HTTP ${response.status} ${response.statusText}. ` +
              "Serve the generated zig-out/web directory, not the source web directory.",
          );
        }
        const wasmBytes = await response.arrayBuffer();
        const { instance } = await WebAssembly.instantiate(wasmBytes, {
          env,
          a11y,
        });
        wasmInstance = instance;

        console.log("[JS] About to call wasmInstance.exports.init()...");
        console.log(
          "[JS] WASM memory size:",
          wasmInstance.exports.memory?.buffer?.byteLength || "unknown",
        );
        try {
          wasmInstance.exports.init();
          console.log("[JS] init() completed successfully");
        } catch (e) {
          console.error("[JS] init() threw error:", e);
          console.error("[JS] Error stack:", e.stack);
          throw e;
        }

        initKeyboard();
        initScroll();
        initMouse();
        initComposition();
      }

      init().catch((err) => {
        console.error(err);
      });
    </script>
  </body>
</html>
